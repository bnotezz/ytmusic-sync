services:
  ytmusic-sync:
    build: .
    image: ytmusic-sync:latest
    container_name: ytmusic-sync
    platform: linux/amd64          # DS720+ = Celeron J4125 = x86_64
    restart: unless-stopped

    # ── Volumes ───────────────────────────────────────────────────────────────
    volumes:
      # Конфіги (config.yml + cookies.txt) — редагуй на хості
      - /volume1/docker/ytmusic-sync/config:/config

      # Музика — або локальний том, або NFS шара
      - /volume1/music/kids:/music
      # Якщо NFS вже змонтована як /mnt/nfs_music:
      # - /mnt/nfs_music:/music

    # ── Environment ───────────────────────────────────────────────────────────
    environment:
      # PUID/PGID — linuxserver стиль
      # Знайди свій: SSH → id твій_юзер
      - PUID=1026
      - PGID=100

      # Cron (хв год * * день_тижня)
      - SYNC_SCHEDULE=0 3 * * 0    # щонеділі 03:00
      # - SYNC_SCHEDULE=0 3 * * *  # щодня 03:00

      - TZ=Europe/Kyiv

      # Опціонально: HA event після синку
      # - HA_URL=http://192.168.1.100:8123
      # - HA_TOKEN=eyJhbGciOiJ...

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"              # Synology Docker: max-file БЕЗ 's'
