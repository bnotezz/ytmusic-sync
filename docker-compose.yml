services:
  ytmusic-sync:
    build: .
    image: ${YTMUSIC_SYNC_IMAGE:-ytmusic-sync:latest}
    container_name: ytmusic-sync
    platform: linux/amd64
    restart: "no"
    network_mode: host
    volumes:
      - ${SYNC_CONFIG_PATH:-/volume1/docker/ytmusic-sync/config}:/config
      - ${SYNC_MUSIC_PATH:-/volume1/music/kids}:/music
    environment:
      PUID: ${SYNC_PUID:-1026}
      PGID: ${SYNC_PGID:-100}
      TZ: ${TZ:-Europe/Kyiv}
      HEALTHCHECKS_UUID: ${HEALTHCHECKS_UUID:-your-healthchecks-uuid-here}
      # Home Assistant event after sync (optional)
      # HA_URL: "http://192.168.1.100:8123"
      # HA_TOKEN: "eyJhbGciOiJ..."
