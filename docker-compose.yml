services:
  ytmusic-sync:
    build: .
    image: ytmusic-sync:latest
    container_name: ytmusic-sync
    platform: linux/amd64
    restart: unless-stopped
    privileged: true
    network_mode: host

    volumes:
      - /volume1/docker/ytmusic-sync/config:/config
      - /volume1/music/kids:/music

    environment:
      - PUID=1026
      - PGID=100
      - SYNC_SCHEDULE=0 3 * * 0
      - TZ=Europe/Kyiv

      # Home Assistant event after sync (optional)
      # - HA_URL=http://192.168.1.100:8123
      # - HA_TOKEN=eyJhbGciOiJ...

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
