# ytmusic-sync — конфігурація
# Збережи як /volume1/docker/ytmusic-sync/config/config.yml

playlists:
  - name: tales
    url: "https://music.youtube.com/playlist?list=PLR8OfFTQ5xtA8HV5ZDrSrbgbfGCZaKXlp"
    output_dir: /music/tales
    format: opus        # opus = нативний YT, без re-encode (рекомендовано)

  - name: lullabies
    url: "https://music.youtube.com/playlist?list=ЗАМІНИТИ_НА_СВІЙ_ID"
    output_dir: /music/lullabies
    format: opus

  - name: party
    url: "https://music.youtube.com/playlist?list=ЗАМІНИТИ_НА_СВІЙ_ID"
    output_dir: /music/party
    format: opus

settings:
  # Куди писати .m3u (Music Assistant читає звідси)
  playlists_dir: /music/playlists

  # Де зберігати список вже скачаних треків
  archive_dir: /music/.sync

  # Cookies для приватних плейлістів (опціонально)
  # Файл: /volume1/docker/ytmusic-sync/config/cookies.txt
  cookies_file: /config/cookies.txt

  # Затримка між треками (секунди) — захист від rate-limit
  sleep_interval: 2
