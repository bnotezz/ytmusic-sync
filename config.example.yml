# ytmusic-sync — конфігурація
# Скопіюй цей файл як config.yml і заповни свої плейлісти

playlists:
  - name: tales               # ім'я → назва папки і m3u файлу
    url: "https://music.youtube.com/playlist?list=PLR8OfFTQ5xtA8HV5ZDrSrbgbfGCZaKXlp"
    output_dir: /music/tales
    format: opus              # opus = нативний формат YT, без re-encode (рекомендовано)
    # format: mp3             # якщо потрібна ширша сумісність

  - name: lullabies
    url: "https://music.youtube.com/playlist?list=ЗМІНИТИ_НА_СВІЙ_ID"
    output_dir: /music/lullabies
    format: opus

  - name: party
    url: "https://music.youtube.com/playlist?list=ЗМІНИТИ_НА_СВІЙ_ID"
    output_dir: /music/party
    format: opus

settings:
  # Куди писати .m3u файли (Music Assistant читає звідси)
  playlists_dir: /music/playlists

  # Де зберігати список вже скачаних треків
  archive_dir: /music/.sync

  # Cookies для приватних плейлістів (опціонально)
  # Як отримати: розширення "Get cookies.txt LOCALLY" → music.youtube.com
  cookies_file: /app/cookies.txt

  # Затримка між треками (секунди) — захист від rate-limit
  sleep_interval: 2
