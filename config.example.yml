# ytmusic-sync — конфігурація
# Зберегти як /volume1/docker/ytmusic-sync/config/config.yml

playlists:
  - name: tales
    url: "https://music.youtube.com/playlist?list=PLR8OfFTQ5xtB7Wde5Ix_ah9Dj2U3jIJTG"
    output_dir: /music/tales
    format: opus

  - name: lullabies
    url: "https://music.youtube.com/playlist?list=ЗАМІНИТИ"
    output_dir: /music/lullabies
    format: opus

  - name: party
    url: "https://music.youtube.com/playlist?list=ЗАМІНИТИ"
    output_dir: /music/party
    format: opus

  - name: morning
    url: "https://music.youtube.com/playlist?list=PLR8OfFTQ5xtDMXwyT55-B7POEwW1cFyG9"
    output_dir: /music/morning
    format: opus

settings:
  playlists_dir: /music/playlists
  archive_dir:   /music/.sync
  cookies_file:  /config/cookies.txt
  sleep_interval: 2

  # Дефолт для bgutil на localhost (порт 4416):
  pot_server_url: "http://127.0.0.1:4416"
