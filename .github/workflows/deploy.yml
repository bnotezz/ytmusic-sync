name: Build and Push Docker Image

on:
  push:
    # Тепер скрипт запускається ТІЛЬКИ коли ви створюєте тег версії (наприклад, v1.0.0)
    tags: [ 'v*.*.*' ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Автоматична генерація тегів та метаданих
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Створює чистий цифровий тег (v1.2.3 -> 1.2.3)
            type=semver,pattern={{version}}
            # Робить цей же образ останнім (latest), щоб WUD на Synology знав, що це найновіший реліз
            type=raw,value=latest

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Збирання з використанням правильних тегів (через steps)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
