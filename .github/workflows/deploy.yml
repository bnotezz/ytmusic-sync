name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
    # Скрипт також спрацює, якщо ви створите тег версії в Git (наприклад, v1.2.3)
    tags: [ 'v*.*.*' ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Автоматична генерація тегів та метаданих
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Робить тег 'latest' для головної гілки
            type=edge,branch=main,value=latest
            # Створює тег на основі версії Git-тегу (v1.0.0 -> 1.0.0)
            type=semver,pattern={{version}}
            # Створює унікальний тег з назвою гілки та коротким SHA коміту (наприклад: main-a1b2c3d)
            type=sha,prefix=${{ github.ref_name }}-,format=short

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Збирання з використанням згенерованих тегів
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Передаємо згенеровані вище теги в процес збирання
          tags: ${{ id.meta.outputs.tags }}
          labels: ${{ id.meta.outputs.labels }}